[project]
name = "yt-insights"
version = "0.2.0"
description = "Build searchable local YouTube transcript corpora and structured insights"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["youtube", "transcripts", "llm", "yt-dlp", "insights", "sqlite", "fts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "InquirerPy>=0.3.4",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.15"]
impersonation = ["curl-cffi>=0.7"]
mcp = ["mcp>=2,<3"]
dev = [
    "mypy>=1.20.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.3",
]

[project.scripts]
yt-insights = "yt_insights.cli:cli"
yt-insights-mcp = "yt_insights.mcp_entrypoint:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yt_insights = ["assistant_assets/**/*", "web/static/**/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mlx_lm"]
ignore_missing_imports = true
