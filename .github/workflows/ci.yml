name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra mcp

      - name: Check changed-line whitespace
        run: git diff --check HEAD^ HEAD

      - name: Lint
        run: uv run --no-sync ruff check src tests scripts

      - name: Type check
        run: uv run --no-sync mypy src

      - name: Test
        run: uv run --no-sync pytest -q

  verification:
    name: Packaging and runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra mcp

      - name: Validate cumulative-research gate evidence
        run: >-
          uv run --no-sync python scripts/validate_cumulative_research_gates.py
          plans/evidence/2026-08-31-cumulative-research-gates.json

      - name: Test MCP and agent integration
        run: >-
          uv run --no-sync pytest -q
          tests/test_mcp_server.py
          tests/test_agent_assets.py
          tests/test_cli_agent_commands.py

      - name: Prime wheel cache and smoke-test online
        run: uv run --no-sync python scripts/smoke_wheel.py

      - name: Smoke-test wheel offline
        run: uv run --no-sync python scripts/smoke_wheel.py --offline
