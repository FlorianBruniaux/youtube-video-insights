name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit SHA for the changed-line whitespace check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Local web interface
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0

      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Install frozen frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Verify committed frontend assets reproducibly
        run: python3 scripts/verify_web_build.py

      - name: Assert verifier left the checkout unchanged
        run: |
          set -eu
          checkout_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$checkout_status" ]; then
            printf '%s\n' "$checkout_status"
            exit 1
          fi

      - name: Test frontend units
        run: pnpm --dir web test

      - name: Check Astro and TypeScript
        run: pnpm --dir web check

      - name: Test local browser flow
        run: pnpm --dir web test:e2e

      - name: Assert frontend gates left the checkout unchanged
        run: |
          set -eu
          checkout_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$checkout_status" ]; then
            printf '%s\n' "$checkout_status"
            exit 1
          fi

  quality:
    name: Quality (Python ${{ matrix.python-version }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.20
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra mcp

      - name: Verify Python-to-browser fixture
        run: >-
          uv run --no-sync python
          web/tests/fixtures/generate_backend_source_acquisition.py --check

      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}
        run: |
          set -eu

          zero_sha=0000000000000000000000000000000000000000
          if ! git cat-file -e "$GITHUB_SHA^{commit}"; then
            echo "Target SHA is not an available commit: $GITHUB_SHA" >&2
            exit 1
          fi

          base_is_commit=true
          case "$GITHUB_EVENT_NAME" in
            pull_request|workflow_dispatch)
              ;;
            push)
              if [ "$BASE_SHA" = "$zero_sha" ]; then
                BASE_SHA=$(git hash-object -w -t tree /dev/null)
                base_is_commit=false
              fi
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [ -z "$BASE_SHA" ]; then
            echo "A base SHA is required for $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          if [ "$BASE_SHA" = "$GITHUB_SHA" ]; then
            echo "Base and target SHA must differ" >&2
            exit 1
          fi
          if [ "$base_is_commit" = true ] && ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "Base SHA is not an available commit: $BASE_SHA" >&2
            exit 1
          fi
          if [ "$base_is_commit" = true ] && ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
            echo "Base SHA is not an ancestor of target SHA" >&2
            exit 1
          fi

          git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Lint
        run: uv run --no-sync ruff check src tests scripts

      - name: Type check
        run: uv run --no-sync mypy src

      - name: Test
        run: uv run --no-sync pytest -q

  verification:
    name: Packaging and runtime verification
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.20
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra mcp

      - name: Validate cumulative-research gate evidence
        run: >-
          uv run --no-sync python scripts/validate_cumulative_research_gates.py
          plans/evidence/2026-08-31-cumulative-research-gates.json

      - name: Test MCP and agent integration
        run: >-
          uv run --no-sync pytest -q
          tests/test_mcp_server.py
          tests/test_agent_assets.py
          tests/test_cli_agent_commands.py

      - name: Prime wheel cache and smoke-test online
        run: uv run --no-sync python scripts/smoke_wheel.py

      - name: Smoke-test wheel offline
        run: uv run --no-sync python scripts/smoke_wheel.py --offline
